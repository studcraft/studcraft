name: Docs require changelog bump

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Docs require changelog bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ruleset changes declare a version bump
        run: |
          set -euo pipefail

          branch="${{ github.head_ref }}"
          if [[ "$branch" == release/v* ]]; then
            echo "Release-cut branch ($branch) — skipping, it's expected to edit CHANGELOG.md."
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          changed=$(git diff --name-only "$base" "$head")

          echo "Changed files:"
          echo "$changed"

          if ! echo "$changed" | grep -qE '^docs/.*\.md$'; then
            echo "No docs/*.md changes in this PR — skipping."
            exit 0
          fi

          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::This PR changes files under docs/ and also edits CHANGELOG.md directly. CHANGELOG.md is now written only by the Release cut workflow, never by individual PRs (this is what prevents concurrent proposal branches from colliding on it) — add a '**Bump:** major|minor|patch' line to a commit message instead. See system/workflow.md."
            exit 1
          fi

          commit_messages=$(git log --format=%B "$base".."$head")

          if ! echo "$commit_messages" | grep -qE '^\*\*Bump:\*\* (major|minor|patch)$'; then
            echo "::error::This PR changes files under docs/ but no commit message includes a '**Bump:** major|minor|patch' line. See system/workflow.md."
            exit 1
          fi

          echo "Bump commit found, CHANGELOG.md untouched. OK."
