name: Archive cut

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  archive-cut:
    name: Archive cut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Archive every fully-applied change
        id: archive
        run: |
          set -euo pipefail
          python3 scripts/archive_cut.py

      - name: Open archive PR
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing archived, no PR to open."
            exit 0
          fi

          branch="archive/batch-$(date +%Y-%m-%d)-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add openspec/
          git commit -m "Archive cut: $(date +%Y-%m-%d)"
          git push origin "$branch"

          {
            echo "## Archive cut ready"
            echo
            echo "Branch \`$branch\` has been pushed. Open the PR to land it:"
            echo
            echo "**https://github.com/${{ github.repository }}/compare/main...$branch?expand=1**"
            echo
            echo "It moves every OpenSpec change with a fully-checked \`tasks.md\` from"
            echo "\`openspec/changes/\` to \`openspec/changes/archive/\`, and writes the resulting"
            echo "capability specs under \`openspec/specs/\`. See system/workflow.md (Archiving)."
            echo
            echo "> Refresh each delta against \`docs/\` before archiving. A delta written a while"
            echo "> ago is not a faithful snapshot, it is an old one."
          } >> "$GITHUB_STEP_SUMMARY"
