name: Docs require OpenSpec proposal

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Docs require OpenSpec proposal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ruleset changes include an OpenSpec proposal
        run: |
          set -euo pipefail

          branch="${{ github.event.pull_request.head.ref }}"

          # Release cut owns the **Version:** header in every docs/*.md file and
          # has no proposal to point at — the bump is computed from git history,
          # not proposed. Exempt it by branch prefix, the same shape the
          # CHANGELOG gate and the archive gate already use. See
          # system/ci-gates.md (Branch-Naming Exemptions for Automation).
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          if [[ "$branch" == release/v* ]]; then
            # The branch name alone must not grant the exemption: anyone able to
            # push a branch could call it release/v9 and land ruleset changes
            # with no proposal. Constrain it by content instead — a genuine
            # release cut only ever rewrites the **Version:** header line.
            offending=$(git diff "$base" "$head" -- 'docs/*.md' \
              | grep -E '^[+-]' \
              | grep -vE '^(\+\+\+|---)' \
              | grep -vE '^[+-]\*\*Version:\*\*' || true)

            if [ -n "$offending" ]; then
              echo "$offending"
              echo "::error::Branch $branch is named like a release cut but changes docs/ content beyond the **Version:** header. A release cut only rewrites that one line. Open a normal proposal branch instead — the release/v* exemption is not a way around the proposal requirement."
              exit 1
            fi

            echo "Release branch ($branch): exempt. Only **Version:** headers changed."
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")

          echo "Changed files:"
          echo "$changed"

          # Which change directories does this PR touch? (archive/ is not one.)
          touched=$(echo "$changed" \
            | grep -oE '^openspec/changes/[^/]+' \
            | grep -v '^openspec/changes/archive$' \
            | sort -u || true)

          if echo "$changed" | grep -qE '^docs/.*\.md$'; then
            if [ -z "$touched" ]; then
              echo "::error::This PR changes files under docs/ (the ruleset) but includes no OpenSpec proposal under openspec/changes/. Ruleset changes are proposed before they are made — see system/workflow.md (OpenSpec Workflow) and CONTRIBUTING.md."
              exit 1
            fi
          fi

          [ -z "$touched" ] && { echo "No proposal touched, and no docs/ change. OK."; exit 0; }

          # One proposal per PR. openspec/config.yaml requires one branch per
          # proposal; without this check nothing enforced it. Archive batches
          # legitimately move many changes at once and are exempt by prefix.
          count=$(echo "$touched" | wc -l | tr -d ' ')
          if [ "$count" -gt 1 ]; then
            echo "$touched"
            echo "::error::This PR touches $count OpenSpec changes. One proposal per pull request, on its own branch — see openspec/config.yaml. Split this into separate PRs so each proposal can be reviewed, applied and archived on its own."
            exit 1
          fi

          # A proposal is three artifacts, not a directory with something in it.
          # Checked against the working tree rather than the diff: a PR that only
          # applies an already-merged proposal legitimately touches tasks.md alone.
          missing=""
          for f in proposal.md design.md tasks.md; do
            [ -f "$touched/$f" ] || missing="$missing $f"
          done

          if [ -n "$missing" ]; then
            echo "::error::$touched is missing:$missing. An OpenSpec proposal needs all three — proposal.md (what and why), design.md (the decisions and what was rejected), tasks.md (how to apply it, with verifiable steps). See system/workflow.md and an archived change under openspec/changes/archive/ for a worked example."
            exit 1
          fi

          echo "Proposal $touched is complete. OK."
