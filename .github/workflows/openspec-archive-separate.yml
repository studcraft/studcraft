name: OpenSpec archive must be separate from apply

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: OpenSpec archive must be separate from apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify archive and apply never land in the same PR
        run: |
          set -euo pipefail

          branch="${{ github.head_ref }}"
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          changed=$(git diff --name-only "$base" "$head")

          touches_docs=$(echo "$changed" | grep -qE '^docs/.*\.md$' && echo yes || echo no)
          touches_specs=$(echo "$changed" | grep -qE '^openspec/specs/' && echo yes || echo no)
          touches_archive=$(echo "$changed" | grep -qE '^openspec/changes/archive/' && echo yes || echo no)

          if [[ "$branch" == archive/* ]]; then
            # Same reasoning as the release exemption: a branch name must not be
            # enough on its own. A real archive cut touches nothing outside
            # openspec/.
            outside=$(git diff --name-only "$base" "$head" | grep -vE '^openspec/' || true)
            if [ -n "$outside" ]; then
              echo "$outside"
              echo "::error::Branch $branch is named like an archive cut but changes files outside openspec/. Archiving only moves changes and writes capability specs. Use a normal proposal branch for anything else."
              exit 1
            fi

            if [[ "$touches_docs" == "yes" ]]; then
              echo "::error::Archive branch ($branch) changes docs/*.md. Archive PRs must only touch openspec/specs/** and openspec/changes/**, never the ruleset itself. See system/workflow.md (Archiving)."
              exit 1
            fi
            # Archiving a change moves its directory under openspec/changes/archive/.
            # It writes openspec/specs/ only when the change carried a delta, and a
            # delta-free change is legitimate — system/proposal-review.md ("Delta vs.
            # Direct Edit") says not to invent one against a capability that does not
            # exist. Requiring a spec write therefore made a delta-free change
            # impossible to archive on its own, and let it through only when some
            # unrelated sibling in the same batch happened to carry a delta.
            if [[ "$touches_specs" == "no" && "$touches_archive" == "no" ]]; then
              echo "::error::Archive branch ($branch) archives nothing: no openspec/changes/archive/ move and no openspec/specs/ write. Check the branch name/PR."
              exit 1
            fi
            echo "Archive-only PR. OK."
            exit 0
          fi

          if [[ "$touches_specs" == "yes" ]]; then
            echo "::error::This PR changes openspec/specs/ but isn't from an archive/* branch. Archiving must happen in its own PR, separate from the change that applies docs/*.md — see system/workflow.md (Archiving). Run the 'Archive cut' GitHub Action (or 'openspec archive <name>' from a branch named archive/<name>) instead."
            exit 1
          fi

          echo "No openspec/specs/ changes outside an archive/* branch. OK."
