name: OpenSpec change is coherent

# Two checks that both used to happen far too late.
#
# `openspec validate` was only ever run inside the Archive cut action, and
# scripts/check_delta_coverage.py reimplements a check that lived only inside
# `openspec archive`. Both therefore fired whenever someone next ran the
# archive batch — potentially weeks after the proposal merged, long after the
# person who could explain the delta had moved on. This repo hit that once and
# it cost two dedicated PRs to untangle. Running them per-PR moves the failure
# to the moment it can still be fixed cheaply.
#
# No `paths:` filter at the `on:` level: this is a required status check, and a
# filtered trigger never creates a check run at all for non-matching PRs, which
# GitHub treats as permanently pending. See system/ci-gates.md.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: OpenSpec change is coherent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec

      # Structural: does every change and spec parse, does every requirement
      # have a scenario.
      #
      # NOT `openspec validate --all`. That treats "change has no deltas" as an
      # error, and this repo has legitimate delta-free changes: several docs/
      # documents predate the OpenSpec workflow and were never formalised as
      # capabilities, so there is nothing to write a delta against. See
      # system/proposal-review.md (Delta vs. Direct Edit) — inventing a delta
      # against a capability that does not exist is explicitly the wrong move.
      #
      # So: validate the living specs always, and validate a change only when
      # it actually ships deltas.
      - name: Validate specs, and any change that ships deltas
        run: |
          set -euo pipefail
          failed=0

          for spec in openspec/specs/*/; do
            name=$(basename "$spec")
            openspec validate "$name" || failed=1
          done

          for change in openspec/changes/*/; do
            name=$(basename "$change")
            [ "$name" = "archive" ] && continue
            if [ -d "$change/specs" ]; then
              echo "Validating change $name (ships deltas)"
              openspec validate "$name" || failed=1
            else
              echo "Skipping change $name — no specs/, which is legitimate here (see system/proposal-review.md, Delta vs. Direct Edit)"
            fi
          done

          exit $failed

      # Semantic: would any MODIFIED block silently delete a scenario the living
      # spec already has? `openspec validate` does not catch this — verified by
      # stripping a scenario from a delta, which validate passed. Only
      # `openspec archive` catches it, and by then it is weeks late.
      - name: Deltas must not drop scenarios the living spec has
        run: python3 scripts/check_delta_coverage.py
