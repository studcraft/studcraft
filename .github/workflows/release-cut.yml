name: Release cut

on:
  workflow_dispatch:
    inputs:
      severity:
        description: "Override bump severity. auto = minor by default, or major if any commit since the last tag flagged itself **Bump:** major."
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: write
  pull-requests: write

jobs:
  release-cut:
    name: Release cut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute next version and update docs
        id: bump
        env:
          RELEASE_SEVERITY: ${{ inputs.severity }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/release_cut.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          branch="release/v$version"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add CHANGELOG.md docs/*.md
          git commit -m "Release v$version"
          git push origin "$branch"

          gh pr create \
            --title "Release v$version" \
            --body "Automated release cut: builds a [v$version] changelog entry from every commit merged since the last release tag and updates the **Version:** header in every docs/*.md file. Severity: minor by default, auto-escalated to major only if a commit flagged **Bump:** major, or overridden explicitly (severity=${{ inputs.severity }}). See system/workflow.md for the release process." \
            --base main \
            --head "$branch"
