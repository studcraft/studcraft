name: Release cut

on:
  workflow_dispatch:
    inputs:
      severity:
        description: "Override bump severity. auto = minor by default, or major if any commit since the last tag flagged itself **Bump:** major."
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto

permissions:
  contents: write

# Mutates shared repository state. Two concurrent dispatches would race
# and produce overlapping branches. Queue rather than cancel: a
# half-finished cut must still complete.
concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  release-cut:
    name: Release cut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute next version and update docs
        id: bump
        env:
          RELEASE_SEVERITY: ${{ inputs.severity }}
        run: |
          set -euo pipefail
          version=$(python3 scripts/release_cut.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pushes the branch and stops there. Opening the PR is left to a human,
      # because the organization does not allow GitHub Actions to create pull
      # requests — and the single setting that would permit it also permits
      # Actions to *approve* them, which would undermine any future review
      # requirement on main. One click at release time is the cheaper trade.
      # See system/ci-gates.md.
      - name: Commit and push the release branch
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          branch="release/v$version"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add CHANGELOG.md docs/*.md
          git commit -m "Release v$version"
          git push origin "$branch"

          {
            echo "## Release v$version is ready"
            echo
            echo "Branch \`$branch\` has been pushed. Open the PR to land it:"
            echo
            echo "**https://github.com/${{ github.repository }}/compare/main...$branch?expand=1**"
            echo
            echo "It updates the \`**Version:**\` header in every \`docs/*.md\` file and adds a"
            echo "\`[$version]\` CHANGELOG entry built from every commit since the last release tag."
            echo "Severity used: \`${{ inputs.severity }}\`."
            echo
            echo "Merging it touches \`CHANGELOG.md\` on \`main\`, which triggers **Tag release** to"
            echo "create \`v$version\` automatically."
          } >> "$GITHUB_STEP_SUMMARY"
