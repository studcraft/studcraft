name: Docs must not edit CHANGELOG.md directly

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Docs must not edit CHANGELOG.md directly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md is untouched
        run: |
          set -euo pipefail

          branch="${{ github.head_ref }}"
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          changed=$(git diff --name-only "$base" "$head")

          if [[ "$branch" == release/v* ]]; then
            # The branch name alone must not grant the exemption — see
            # system/ci-gates.md (Branch-Naming Exemptions for Automation).
            # A genuine release cut is `git add CHANGELOG.md docs/*.md` and
            # nothing else (.github/workflows/release-cut.yml), and inside
            # docs/ it rewrites only the **Version:** header line.
            outside=$(echo "$changed" | grep -vE '^(CHANGELOG\.md|docs/[^/]+\.md)$' || true)
            if [ -n "$outside" ]; then
              echo "$outside"
              echo "::error::Branch $branch is named like a release cut but changes files outside CHANGELOG.md and docs/*.md. A release cut touches only those two. Open a normal branch instead — the release/v* exemption is not a way to edit CHANGELOG.md by hand."
              exit 1
            fi

            offending=$(git diff "$base" "$head" -- 'docs/*.md' \
              | grep -E '^[+-]' \
              | grep -vE '^(\+\+\+|---)' \
              | grep -vE '^[+-]\*\*Version:\*\*' || true)

            if [ -n "$offending" ]; then
              echo "$offending"
              echo "::error::Branch $branch is named like a release cut but changes docs/ content beyond the **Version:** header. A release cut only rewrites that one line. The release/v* exemption is not a way around the CHANGELOG.md rule."
              exit 1
            fi

            echo "Release branch ($branch): exempt. Only CHANGELOG.md and **Version:** headers changed."
            exit 0
          fi

          if ! echo "$changed" | grep -qE '^docs/.*\.md$'; then
            echo "No docs/*.md changes in this PR — CHANGELOG.md is free to edit (e.g. tooling/process updates)."
            exit 0
          fi

          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::This PR changes docs/*.md and also edits CHANGELOG.md directly. CHANGELOG.md is written only by the Release cut workflow, never by ruleset-changing PRs — this is what prevents concurrent proposal branches from colliding on it. No PR needs to declare a version bump either: docs/*.md changes default to a minor release automatically. See system/workflow.md."
            exit 1
          fi

          echo "CHANGELOG.md untouched. OK."
